<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="System architecture: network traffic flows through monitor, detector, SQLite, and the Flask dashboard" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7f91"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff5252"/>
    </marker>
    <clipPath id="round"><rect width="960" height="340" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="960" height="340" fill="#0d1117"/>

    <!-- connectors -->
    <line x1="190" y1="90" x2="278" y2="90" stroke="#6e7f91" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="440" y1="90" x2="528" y2="90" stroke="#6e7f91" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="690" y1="90" x2="778" y2="90" stroke="#6e7f91" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
    <polyline points="360,130 360,250 403,250" fill="none" stroke="#6e7f91" stroke-width="2" marker-end="url(#arrow)"/>
    <polyline points="567,250 610,250 610,132" fill="none" stroke="#ff5252" stroke-width="2" marker-end="url(#arrowRed)"/>

    <!-- boxes -->
    <g>
      <rect x="30" y="50" width="160" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <text x="110" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Network Traffic</text>
      <text x="110" y="107" text-anchor="middle" font-size="12" fill="#8b949e" font-family="'Courier New', monospace">eth0 / lab LAN</text>
    </g>
    <g>
      <rect x="280" y="50" width="160" height="80" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="360" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">monitor.py</text>
      <text x="360" y="107" text-anchor="middle" font-size="12" fill="#8b949e" font-family="'Courier New', monospace">Scapy capture</text>
    </g>
    <g>
      <rect x="530" y="50" width="160" height="80" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
      <text x="610" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">SQLite</text>
      <text x="610" y="107" text-anchor="middle" font-size="12" fill="#8b949e" font-family="'Courier New', monospace">packets | alerts</text>
    </g>
    <g>
      <rect x="780" y="50" width="160" height="80" rx="10" fill="#161b22" stroke="#00e676" stroke-width="2"/>
      <text x="860" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Flask Dashboard</text>
      <text x="860" y="107" text-anchor="middle" font-size="12" fill="#8b949e" font-family="'Courier New', monospace">UI + JSON API</text>
    </g>
    <g>
      <rect x="405" y="210" width="162" height="80" rx="10" fill="#161b22" stroke="#ff5252" stroke-width="2">
        <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="486" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">detector.py</text>
      <text x="486" y="267" text-anchor="middle" font-size="12" fill="#8b949e" font-family="'Courier New', monospace">port-scan engine</text>
    </g>

    <!-- labels -->
    <text x="234" y="80" text-anchor="middle" font-size="11" fill="#8b949e">packets</text>
    <text x="484" y="80" text-anchor="middle" font-size="11" fill="#8b949e">store</text>
    <text x="734" y="80" text-anchor="middle" font-size="11" fill="#8b949e">query</text>
    <text x="372" y="195" font-size="11" fill="#8b949e">inspect</text>
    <text x="622" y="195" font-size="11" fill="#ff5252">alerts</text>

    <!-- moving packets -->
    <circle r="6" fill="#58a6ff">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M190,90 L278,90"/>
    </circle>
    <circle r="6" fill="#58a6ff">
      <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M190,90 L278,90"/>
    </circle>
    <circle r="6" fill="#58a6ff">
      <animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" path="M440,90 L528,90"/>
    </circle>
    <circle r="6" fill="#58a6ff">
      <animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" path="M440,90 L528,90"/>
    </circle>
    <circle r="6" fill="#00e676">
      <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M690,90 L778,90"/>
    </circle>
    <circle r="6" fill="#58a6ff">
      <animateMotion dur="2.8s" begin="0.8s" repeatCount="indefinite" path="M360,130 L360,250 L403,250"/>
    </circle>
    <circle r="7" fill="#ff5252">
      <animateMotion dur="2.8s" begin="1.9s" repeatCount="indefinite" path="M567,250 L610,250 L610,132"/>
    </circle>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
