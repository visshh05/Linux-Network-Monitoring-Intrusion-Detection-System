<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="Linux Network Monitoring and Intrusion Detection System banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101c2b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f2a37" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#00e676" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00e676" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e676" stop-opacity="0"/>
      <stop offset="1" stop-color="#00e676" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="round"><rect width="960" height="240" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="960" height="240" fill="url(#bg)"/>
    <rect width="960" height="240" fill="url(#grid)"/>
    <rect width="960" height="240" fill="url(#glow)"/>

    <!-- scanning sweep -->
    <rect x="0" y="-40" width="960" height="40" fill="url(#scan)">
      <animate attributeName="y" from="-40" to="240" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- title -->
    <text x="480" y="92" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#e6edf3">
      Linux Network Monitoring &amp; Intrusion Detection System
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="480" y="128" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" fill="#8b949e">
      capture • analyze • detect • alert
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="1.2s" fill="freeze"/>
    </text>

    <!-- packet stream -->
    <line x1="140" y1="168" x2="820" y2="168" stroke="#2b3a4a" stroke-width="2" stroke-dasharray="6 8"/>
    <circle r="5" fill="#58a6ff">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M140,168 L820,168"/>
    </circle>
    <circle r="5" fill="#58a6ff">
      <animateMotion dur="3.2s" begin="1.06s" repeatCount="indefinite" path="M140,168 L820,168"/>
    </circle>
    <circle r="5" fill="#58a6ff">
      <animateMotion dur="3.2s" begin="2.12s" repeatCount="indefinite" path="M140,168 L820,168"/>
    </circle>

    <!-- status: monitoring -->
    <g transform="translate(60,206)">
      <circle cx="0" cy="0" r="5" fill="#00e676"/>
      <circle cx="0" cy="0" r="5" fill="none" stroke="#00e676" stroke-width="2">
        <animate attributeName="r" from="5" to="16" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.9" to="0" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="20" y="5" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#00e676">MONITORING</text>
    </g>

    <!-- status: blinking alert -->
    <g transform="translate(900,206)">
      <text x="0" y="5" text-anchor="end" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#ff5252">
        ALERT: Port Scan Detected
        <animate attributeName="opacity" values="0;0;1;1;0;1;1;0;0" keyTimes="0;0.45;0.5;0.62;0.66;0.7;0.85;0.9;1" dur="6s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
